name: Resume visual audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'client/src/features/resume-builder/**'
      - '.github/workflows/resume-visual-audit.yml'
permissions:
  contents: read
jobs:
  visual-previews:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Create isolated sample-only browser page
        run: |
          cat > resume-audit.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#e3e5e7"><div id="root"></div><script type="module" src="/src/resume-audit-entry.tsx"></script></body></html>
          HTML
          cat > src/resume-audit-entry.tsx <<'TSX'
          import React from 'react'
          import {createRoot} from 'react-dom/client'
          import ResumeDocument from './features/resume-builder/templates/ResumeDocument'
          import {sampleForTemplate} from './features/resume-builder/templates/sampleResume'
          import {templateSchema} from './features/resume-builder/templates/registry'
          const input=new URLSearchParams(location.search).get('template')
          const template=templateSchema.safeParse(input).data ?? 'ats-essential'
          createRoot(document.getElementById('root')!).render(
            <div style={{width:794,margin:'0 auto'}}><ResumeDocument template={template} snapshot={sampleForTemplate(template)}/></div>
          )
          TSX
          (bun run dev -- --host 127.0.0.1 > /tmp/resume-audit-vite.log 2>&1 &)
          for i in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3000/resume-audit.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/resume-audit-vite.log
          exit 1
      - name: Capture five real browser previews
        run: |
          set -e
          BROWSER=$(command -v google-chrome || command -v chromium)
          mkdir -p /tmp/resume-audit
          for id in executive classic modern executive-modern ats-essential; do
            "$BROWSER" --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=4500 --window-size=810,1160 --screenshot="/tmp/resume-audit/$id.png" "http://127.0.0.1:3000/resume-audit.html?template=$id" >/tmp/chromium-stderr.log 2>&1 || { cat /tmp/chromium-stderr.log; exit 1; }
            test -s "/tmp/resume-audit/$id.png"
            echo "AUDIT_IMAGE_START:$id"
            base64 -w 2048 "/tmp/resume-audit/$id.png"
            echo "AUDIT_IMAGE_END:$id"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: five-resume-visual-previews
          path: /tmp/resume-audit/*.png
          retention-days: 14
